version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: supply_chain_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplychain}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: supply_chain_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: supply_chain_backend
    restart: always
    command: gunicorn config.asgi:application -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
      - static_volume:/app/backend/staticfiles
      - chroma_data:/app/chroma_data
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: supply_chain_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app/backend
      - chroma_data:/app/chroma_data
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: supply_chain_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  static_volume:
  chroma_data:
